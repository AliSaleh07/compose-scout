version: '3.8'

services:
  web_api:
    image: my-app:latest
    privileged: true
    network_mode: host
    ports:
      - "5432:5432"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_PASSWORD=SuperSecretProdPassword!
    cap_add:
      - ALL

  worker:
    image: worker:latest
    user: root
