version: '3.8'

services:
  secure_web:
    image: python:3.12-alpine
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
